<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harness Stats — homepage preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f6faf8;
        background: #101916;
      }
      main {
        width: 1600px;
        height: 1000px;
        padding: 60px 56px 44px;
        background: radial-gradient(ellipse at 94% 0%, #1b382c 0%, transparent 56%);
      }
      header { position: relative; padding-bottom: 42px; }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #acbdb5;
        font-size: 25px;
        font-weight: 550;
        letter-spacing: 2.2px;
      }
      .dot { width: 11px; height: 11px; border-radius: 50%; background: #00db89; }
      h1 { margin: 30px 0 14px; font-size: 112px; line-height: 1.05; font-weight: 630; letter-spacing: -5.4px; }
      .subtitle { margin: 0; color: #b2c1ba; font-size: 41px; line-height: 1.3; letter-spacing: -0.8px; }
      .logo { position: absolute; top: 28px; right: 0; width: 150px; height: 150px; border-radius: 31px; }
      figure { margin: 18px 0 0; padding: 12px; background: #fff; border: 1px solid #d9e5de; border-radius: 28px; overflow: hidden; }
      .capture { display: block; width: 100%; height: auto; border-radius: 16px; }
      footer { display: flex; justify-content: space-between; align-items: center; margin-top: 34px; }
      .features { color: #d2dfd8; font-size: 27px; font-weight: 500; letter-spacing: -0.3px; }
      .features span { color: #5d786a; margin: 0 14px; }
      .note { color: #80998c; font-size: 23px; }
    </style>
  </head>
  <body>
    <main aria-label="Harness Stats homepage preview">
      <header>
        <div class="eyebrow"><span class="dot"></span>FOR PASEO · CODEX + CLAUDE CODE</div>
        <h1>Harness Stats</h1>
        <p class="subtitle">Session performance, at a glance.</p>
        <img class="logo" src="icon.png" alt="Harness Stats logo" />
      </header>
      <figure>
        <img class="capture" src="screenshot-performance.png" alt="Actual Harness Stats performance popover and composer footer from a demo session in Paseo" />
      </figure>
      <footer>
        <div class="features">Turns<span>·</span>Tokens<span>·</span>Cache hit<span>·</span>Output speed</div>
        <div class="note">Actual interface · Demo session</div>
      </footer>
    </main>
  </body>
</html>
